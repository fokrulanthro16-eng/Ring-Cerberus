version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cerberus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - MOCK_AWS=${MOCK_AWS:-true}
      - AIRLOCK_SECRET_SEED=${AIRLOCK_SECRET_SEED:-CERBERUS_DEFENSE_TOP_SECRET_AIRLOCK_2026}
      - LOCKDOWN_PIN=${LOCKDOWN_PIN:-9941}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cerberus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cerberus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - cerberus-net

networks:
  cerberus-net:
    driver: bridge
